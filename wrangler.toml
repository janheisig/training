name = "training"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# Der Projektname oben muss mit dem Project name in Cloudflare Pages übereinstimmen,
# sonst bricht der Build ab.

# Die D1-Datenbank.
#
# `database_id` musst du EINMAL selbst eintragen. Die ID steht im Cloudflare-Dashboard
# auf der Übersichtsseite deiner Datenbank: Storage & Databases → D1 → training.
# Klick-Anleitung: SETUP.md, Schritt 1 und Schritt 3.
#
# Solange hier die Nullen stehen, meldet /api/health  "db": "fehlt".
[[d1_databases]]
binding = "DB"
database_name = "training"
database_id = "ea16efbc-66a2-4e52-850a-a1f8951ac92d"
